<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8643b">
  <title>おうちレシピ帖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <button class="icon-btn" id="backBtn" aria-label="戻る" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="app-title" id="appTitle">おうちレシピ帖</h1>
    <span class="header-spacer"></span>
  </header>

  <main>
    <!-- 一覧画面 -->
    <section id="listView" class="view">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="searchInput" placeholder="料理名・材料で検索" aria-label="レシピを検索">
      </div>
      <div class="tabs" id="categoryTabs" role="tablist" aria-label="料理の分類"></div>
      <p class="count" id="recipeCount"></p>
      <ul class="card-grid" id="recipeList"></ul>
      <p class="empty" id="emptyMsg" hidden>レシピが見つかりません</p>
    </section>

    <!-- 詳細画面 -->
    <section id="detailView" class="view" hidden></section>

    <!-- 編集画面 -->
    <section id="editView" class="view" hidden>
      <form id="recipeForm" class="form" novalidate>
        <label class="field">
          <span>料理名 <em>*</em></span>
          <input type="text" name="dishName" required maxlength="60" placeholder="例：肉じゃが">
        </label>

        <label class="field field-small">
          <span>何人分 <small>（1〜4人）</small></span>
          <input type="number" name="servings" min="1" max="4" value="2" inputmode="numeric">
        </label>

        <fieldset class="field">
          <legend class="field-legend">分類</legend>
          <div class="seg" id="categoryChoices"></div>
        </fieldset>

        <fieldset class="group">
          <legend>材料と分量</legend>
          <div id="ingredientRows"></div>
          <button type="button" class="btn btn-ghost" id="addIngredientBtn">＋ 材料を追加</button>
        </fieldset>

        <fieldset class="group">
          <legend>栄養素 <small>（レシピ全体の合計）</small></legend>
          <div class="nutri-inputs">
            <label class="field"><span>エネルギー (kcal)</span><input type="number" name="kcal" min="0" step="1" inputmode="decimal"></label>
            <label class="field"><span>たんぱく質 (g)</span><input type="number" name="protein" min="0" step="0.1" inputmode="decimal"></label>
            <label class="field"><span>脂質 (g)</span><input type="number" name="fat" min="0" step="0.1" inputmode="decimal"></label>
            <label class="field"><span>炭水化物 (g)</span><input type="number" name="carbs" min="0" step="0.1" inputmode="decimal"></label>
            <label class="field"><span>食塩相当量 (g)</span><input type="number" name="salt" min="0" step="0.1" inputmode="decimal"></label>
          </div>
        </fieldset>

        <fieldset class="group">
          <legend>作り方</legend>
          <p class="hint">{しょうゆ} のように材料名を { } で囲むと、人数に合わせた分量が表示されます</p>
          <div id="stepRows"></div>
          <button type="button" class="btn btn-ghost" id="addStepBtn">＋ 手順を追加</button>
        </fieldset>

        <p class="form-error" id="formError" role="alert"></p>

        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="cancelBtn">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存する</button>
        </div>
      </form>
    </section>
  </main>

  <button class="fab" id="addBtn" aria-label="レシピを追加">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- 材料の栄養解説 -->
  <dialog class="sheet" id="infoSheet" aria-labelledby="infoTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="icon-btn sheet-close" id="infoClose" aria-label="閉じる">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="infoBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="ingredients.js"></script>
  <script src="micronutrients.js"></script>
  <script src="nutrients.js"></script>
  <script src="samples.js"></script>
  <script src="app.js"></script>
</body>
</html>
